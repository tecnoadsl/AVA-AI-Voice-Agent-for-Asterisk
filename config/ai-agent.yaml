# ═══════════════════════════════════════════════════════════════════════════
# Golden Baseline #3: Local Hybrid Pipeline - Privacy-Focused Configuration
# ═══════════════════════════════════════════════════════════════════════════
#
# VALIDATED CONFIGURATION - Production-ready
#
# Architecture: Hybrid Cloud-Local Pipeline
#   STT: Vosk (local)   - Audio privacy, no cloud transmission of voice
#   LLM: OpenAI (cloud) - Fast, intelligent responses via API
#   TTS: Piper (local)  - Natural voice synthesis, offline capability
#
# Requirements:
#   - OPENAI_API_KEY in .env file (for LLM only)
#   - 8GB+ RAM recommended (16GB optimal)
#   - Docker with local-ai-server container running
#   - First start downloads ~200MB models (5-10 minutes)
#
# Performance:
#   - Response time: 3-7 seconds (typical on modern hardware)
#   - Audio quality: Very good (Piper TTS, local Vosk STT)
#   - Cost: ~$0.001-0.003 per minute (only LLM charged)
#
# Best for:
#   - Audio privacy compliance (HIPAA, GDPR scenarios)
#   - Cost-sensitive deployments (90% cheaper than full cloud)
#   - Organizations with cloud policy restrictions
#
# For detailed parameter explanations, see: docs/Configuration-Reference.md
# ═══════════════════════════════════════════════════════════════════════════

# Active Configuration
config_version: 6
active_pipeline: local_hybrid
default_provider: local_hybrid

# Audio Transport - ExternalMedia RTP for pipelines
audio_transport: externalmedia
external_media:
  codec: ulaw
  direction: both
  port_range: 18080:18099
  rtp_host: 0.0.0.0
  rtp_port: 18080

# Playback Mode - File mode is the most validated/robust option for pipelines (streaming-first is supported with fallback)
downstream_mode: file

# Contexts
contexts:
  default:
    greeting: "Buongiorno, benvenuto in TecnoADSL. Sono l'assistente virtuale, come posso aiutarla?"
    profile: telephony_ulaw_8k
    prompt: >-
      Sei l'assistente telefonico virtuale di TecnoADSL, un Internet Service Provider
      italiano con sede in Umbria specializzato in connettività fibra ottica, FTTC, FTTH,
      FWA e servizi di telecomunicazione per privati e aziende.

      REGOLE DI COMPORTAMENTO:
      - Rispondi SEMPRE in italiano, in modo cordiale e professionale.
      - Usa frasi brevi e chiare, adatte a una conversazione telefonica (massimo 2-3 frasi per risposta).
      - Dai del Lei al cliente.
      - Non inventare informazioni tecniche specifiche (prezzi, velocità, copertura) se non le conosci.
        In quel caso, proponi di trasferire la chiamata a un operatore umano.

      SERVIZI TECNOADSL:
      - Connettività internet: Fibra FTTH fino a 2.5 Gbps, FTTC fino a 200 Mbps, FWA fino a 100 Mbps
      - Telefonia VoIP aziendale e residenziale
      - Servizi cloud e hosting
      - Assistenza tecnica e supporto clienti
      - Soluzioni per aziende: VPN, reti dedicate, backup connettività

      COSA PUOI FARE:
      - Fornire informazioni generali sui servizi e le offerte
      - Raccogliere segnalazioni di guasti o problemi di connessione
      - Verificare lo stato di un'attivazione o di un ticket di assistenza
      - Proporre il trasferimento a un operatore per questioni commerciali o tecniche complesse

      Se il cliente ha un problema tecnico, chiedi:
      1. Nome e cognome o codice cliente
      2. Tipo di problema (connessione assente, lenta, intermittente)
      3. Da quando si verifica il problema

      Se non riesci a risolvere, rispondi: "La metto in contatto con un nostro operatore
      che potrà assisterla al meglio."

# Barge-In Configuration
barge_in:
  enabled: true
  energy_threshold: 700
  initial_protection_ms: 100
  min_ms: 150
  post_tts_end_protection_ms: 100

# VAD Configuration - Critical for pipelines
vad:
  enhanced_enabled: true
  fallback_buffer_size: 128000
  fallback_enabled: true
  fallback_interval_ms: 4000
  max_utterance_duration_ms: 10000
  min_utterance_duration_ms: 600
  use_provider_vad: false
  utterance_padding_ms: 200
  webrtc_aggressiveness: 1
  webrtc_end_silence_frames: 50
  webrtc_start_frames: 3

# Streaming Configuration
streaming:
  chunk_size_ms: 20
  connection_timeout_ms: 120000
  continuous_stream: true
  empty_backoff_ticks_max: 5
  fallback_timeout_ms: 8000
  greeting_min_start_ms: 40
  jitter_buffer_ms: 950
  keepalive_interval_ms: 5000
  low_watermark_ms: 80
  min_start_ms: 120
  normalizer:
    enabled: true
    max_gain_db: 18.0
    target_rms: 1400
  provider_grace_ms: 500
  sample_rate: 8000

# Audio Profiles
profiles:
  default: telephony_responsive
  telephony_ulaw_8k:
    chunk_ms: auto
    idle_cutoff_ms: 800
    internal_rate_hz: 8000
    provider_pref:
      input_encoding: mulaw
      input_sample_rate_hz: 8000
      output_encoding: mulaw
      output_sample_rate_hz: 8000
    transport_out:
      encoding: slin
      sample_rate_hz: 8000
  telephony_responsive:
    chunk_ms: auto
    idle_cutoff_ms: 600
    internal_rate_hz: 8000
    provider_pref:
      input_encoding: mulaw
      input_sample_rate_hz: 8000
      output_encoding: mulaw
      output_sample_rate_hz: 8000
    transport_out:
      encoding: slin
      sample_rate_hz: 8000

# Pipeline Definition - Hybrid (ElevenLabs STT/TTS + Ollama LLM)
pipelines:
  local_hybrid:
    llm: local_llm
    options:
      llm:
        base_url: http://127.0.0.1:11434
        max_tokens: 150
        model: qwen3:30b-a3b-q4_K_M
        temperature: 0.7
      stt:
        chunk_ms: 160
        mode: stt
        stream_format: pcm16_16k
        streaming: true
      tts:
        format:
          encoding: mulaw
          sample_rate: 8000
    stt: local_stt
    tts: elevenlabs_tts

# Provider Configuration - Local AI Server
providers:
  local:
    chunk_ms: ${LOCAL_WS_CHUNK_MS:=320}
    connect_timeout_sec: ${LOCAL_WS_CONNECT_TIMEOUT:=2.0}
    enabled: true
    llm_model: models/llm/phi-3-mini-4k-instruct.Q4_K_M.gguf
    max_tokens: 32
    response_timeout_sec: ${LOCAL_WS_RESPONSE_TIMEOUT:=10.0}
    stt_model: models/stt/vosk-model-it-0.22
    temperature: 0.4
    tts_voice: models/tts/it_IT-riccardo-x_low.onnx
    ws_url: ${LOCAL_WS_URL:-ws://127.0.0.1:8765}
  local_stt:
    auth_token: ${LOCAL_WS_AUTH_TOKEN:-}
    capabilities:
      - stt
    chunk_ms: ${LOCAL_WS_CHUNK_MS:=320}
    connect_timeout_sec: ${LOCAL_WS_CONNECT_TIMEOUT:=2.0}
    enabled: false
    response_timeout_sec: ${LOCAL_WS_RESPONSE_TIMEOUT:=10.0}
    stt_backend: vosk
    stt_model: models/stt/vosk-model-en-us-0.22
    type: local
    # Uses LOCAL_WS_URL (see providers.local.base_url note above).
    ws_url: ${LOCAL_WS_URL:-ws://127.0.0.1:8765}
  local_tts:
    auth_token: ${LOCAL_WS_AUTH_TOKEN:-}
    capabilities:
      - tts
    enabled: false
    response_timeout_sec: ${LOCAL_WS_RESPONSE_TIMEOUT:=10.0}
    tts_voice: models/tts/en_US-lessac-medium.onnx
    type: local
    # Uses LOCAL_WS_URL (see providers.local.base_url note above).
    ws_url: ${LOCAL_WS_URL:-ws://127.0.0.1:8765}
  openai_llm:
    capabilities:
      - llm
    api_key: ${OPENAI_API_KEY}
    chat_base_url: https://api.openai.com/v1
    chat_model: gpt-4o-mini
    enabled: false
    response_timeout_sec: 5
    temperature: 0.7
    type: openai
  groq_llm:
    capabilities:
      - llm
    api_key: ${GROQ_API_KEY}
    chat_base_url: https://api.groq.com/openai/v1
    chat_model: llama-3.3-70b-versatile
    enabled: false
    response_timeout_sec: 10
    temperature: 0.7
    tools_enabled: false
    type: openai
  groq_stt:
    capabilities:
      - stt
    type: groq
    enabled: false
    # API key comes from GROQ_API_KEY env var
    stt_base_url: https://api.groq.com/openai/v1/audio/transcriptions
    stt_model: whisper-large-v3-turbo
    response_format: json
    temperature: 0
    request_timeout_sec: 15
  groq_tts:
    capabilities:
      - tts
    type: groq
    enabled: false
    # API key comes from GROQ_API_KEY env var
    tts_base_url: https://api.groq.com/openai/v1/audio/speech
    tts_model: canopylabs/orpheus-v1-english
    voice: hannah
    response_format: wav
    max_input_chars: 200
    target_encoding: mulaw
    target_sample_rate_hz: 8000
    chunk_size_ms: 20
    request_timeout_sec: 15
  # ─────────────────────────────────────────────────────────────────────────────
  # Azure Speech Service — STT & TTS (REST API)
  # Requires AZURE_SPEECH_KEY in .env and a valid Azure region below.
  # ─────────────────────────────────────────────────────────────────────────────
  azure_stt:
    type: azure
    capabilities:
      - stt
    enabled: false
    # Azure region (e.g. eastus, westeurope, southeastasia)
    region: eastus
    # BCP-47 recognition language
    language: en-US
    # 'realtime' = one-shot STT REST | 'fast' = Fast Transcription API
    variant: realtime
    request_timeout_sec: 15.0
  azure_tts:
    type: azure
    capabilities:
      - tts
    enabled: false
    region: eastus
    # Neural voice name — see https://aka.ms/speech/voices
    voice_name: en-US-JennyNeural
    # Azure output format — telephony-optimised RIFF PCM (matches UI quick-add template)
    output_format: riff-8khz-16bit-mono-pcm
    target_encoding: mulaw
    target_sample_rate_hz: 8000
    chunk_size_ms: 20
    request_timeout_sec: 15.0
  minimax_llm:
    capabilities:
      - llm
    chat_base_url: https://api.minimax.io/v1
    # Domestic (China) URL: https://api.minimaxi.com/v1
    chat_model: MiniMax-M2.7
    # Alternatives: MiniMax-M2.7-highspeed, MiniMax-M2.5, MiniMax-M2.5-highspeed
    enabled: false
    # API key comes from MINIMAX_API_KEY env var
    temperature: 1.0
    response_timeout_sec: 30
    type: minimax
  ollama_llm:
    capabilities:
      - llm
    base_url: http://localhost:11434
    model: llama3.2
    enabled: false
    temperature: 0.7
    max_tokens: 200
    timeout_sec: 60
    tools_enabled: true
    type: ollama
  openai_realtime:
    base_url: wss://api.openai.com/v1/realtime
    capabilities:
      - stt
      - llm
      - tts
    continuous_input: true
    egress_pacer_enabled: false
    egress_pacer_warmup_ms: 320
    enabled: false
    greeting: Hello, how can I help you today?
    input_encoding: ulaw
    input_gain_max_db: 0
    input_gain_target_rms: 0
    input_sample_rate_hz: 8000
    instructions: You are a voice assistant. Always speak your responses out loud.
    max_response_output_tokens: 4096
    api_version: beta
    model: gpt-4o-realtime-preview-2024-12-17
    organization: ''
    output_encoding: mulaw
    output_sample_rate_hz: 24000
    provider_input_encoding: linear16
    provider_input_sample_rate_hz: 24000
    response_modalities:
      - audio
      - text
    target_encoding: mulaw
    target_sample_rate_hz: 8000
    temperature: 0.6
    turn_detection:
      create_response: true
      prefix_padding_ms: 300
      silence_duration_ms: 1000
      threshold: 0.5
      type: server_vad
    type: openai_realtime
    voice: alloy
  elevenlabs_agent:
    type: full
    enabled: false
    capabilities:
      - stt
      - llm
      - tts
    input_encoding: ulaw
    input_sample_rate_hz: 8000
    provider_input_encoding: pcm16
    provider_input_sample_rate_hz: 16000
    output_encoding: pcm16
    output_sample_rate_hz: 16000
    target_encoding: ulaw
    target_sample_rate_hz: 8000
    voice_id: uDsPstFWFBUXjIBimV7s
    model_id: eleven_flash_v2_5
    voice_settings:
      stability: 0.5
      similarity_boost: 0.75
      style: 0
      use_speaker_boost: true
    greeting: Hello! I'm your ElevenLabs voice assistant. How can I help you today?
    instructions: You are a helpful voice assistant. Be concise and friendly.
    continuous_input: true
    input_gain_target_rms: 0
    input_gain_max_db: 0
  # ElevenLabs TTS - Modular pipeline adapter for STT→LLM→TTS pipelines
  # Use with pipelines (e.g., local_stt + openai_llm + elevenlabs_tts)
  # Requires ELEVENLABS_API_KEY in .env
  elevenlabs_tts:
    type: elevenlabs
    enabled: true
    api_key: ${ELEVENLABS_API_KEY}
    voice_id: GOAZNavLupajyL3YafaD
    model_id: eleven_flash_v2_5
    output_format: ulaw_8000
    stability: 0.5
    similarity_boost: 0.75

# LLM Fallback Configuration
llm:
  initial_greeting: "Buongiorno, benvenuto in TecnoADSL. Come posso aiutarla?"
  prompt: "Assistente telefonico TecnoADSL. Rispondi in italiano, in modo breve e cordiale. Dai del Lei."

# Asterisk Configuration
asterisk:
  app_name: asterisk-ai-voice-agent

# AudioSocket (not used by ExternalMedia, but required by config schema)
audiosocket:
  format: slin
  host: 0.0.0.0
  port: 8090
